[package]
name = "koia-shell"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
config = "0.15.25"
dirs = "6.0.0"
env_logger = "0.11.11"
freedesktop-desktop-entry = "0.8.1"
freedesktop-icons = "0.4.0"
futures = "0.3.33"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.33"
niri-ipc = "26.4.0"
serde = "1.0.229"
slint = { version = "=1.17.1", default-features = false, features = [
   "renderer-skia", "std", "backend-winit","serde",
] }
spell-framework = { git = "https://github.com/themkoi/Spell", rev = "7c1abc8b547f8008c8f1b7b32a3383979fe69ba5" }
toml = "1.1.3"
tokio = "1.53.0"
notify = "8.2.0"

chrono = "0.4.45"
serde_json = "1.0.150"
zbus = "5.18.0"
system-tray = "0.8.7"
wayle-power-profiles = "0.1.4"
smithay-client-toolkit = "0.20.0"
wayland-client = "0.31.15"
urlencoding = "2.1.3"

[features]
default = ["framework", "stasis"]
framework = []
stasis = []
default_hardware = []

[build-dependencies]
slint-build = "=1.17.1"

[profile.dev]
debug = 2
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
opt-level = 0
lto = false
panic = "abort"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
debug = 0
debug-assertions = false
